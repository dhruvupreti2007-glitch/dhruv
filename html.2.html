<!DOCTYPE html>
<html>
<head>
    <title>User Registration</title>
    <style>
        body {
            font-family: Arial;
            background: #eaf0f8;
        }

        .container {
            width: 350px;
            margin: 70px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
        }

        input {
            width: 95%;
            padding: 12px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563c7;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>User Registration</h2>

    <form action="register" method="post">

        <input type="text"
               name="name"
               placeholder="Full Name"
               required>

        <input type="email"
               name="email"
               placeholder="Email Address"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               minlength="6"
               required>

        <button type="submit">Register</button>

    </form>

    <p>Already registered?
       <a href="login.jsp">Login Here</a>
    </p>
</div>

</body>
</html>
